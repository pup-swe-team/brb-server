{% load static %}{% load portal_extras %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CoPUPAdmin{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'admin_portal/portal.css' %}">
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5 6.5-5s5.9 1.6 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.8 15.2c2.8.4 4.4 1.9 4.8 4.8"/></symbol>
    <symbol id="icon-verification" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5.5 17c.7-2.2 2-3 3.5-3s2.8.8 3.5 3"/><path d="M15 9l2 2 3-3"/></symbol>
    <symbol id="icon-reports" viewBox="0 0 24 24"><path d="M9 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"/><path d="M9 3v4h7"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="icon-unreturned" viewBox="0 0 24 24"><path d="M10 4a6 6 0 0 0-6 6v6a2 2 0 0 0 2 2h3v-5H5"/><path d="M14 20a6 6 0 0 0 6-6V8a2 2 0 0 0-2-2h-3v5h4"/></symbol>
    <symbol id="icon-disputes" viewBox="0 0 24 24"><path d="M12 3l8 4.5V12c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7.5z"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8"/></symbol>
    <symbol id="icon-moderation" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9.5 12l2 2 3.5-4"/></symbol>
    <symbol id="icon-pickup" viewBox="0 0 24 24"><path d="M12 21c-4.5-3.5-7-6.7-7-10a7 7 0 0 1 14 0c0 3.3-2.5 6.5-7 10z"/><circle cx="12" cy="11" r="2.5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.7-1.6L13.4 2h-2.8l-.4 2.8a7 7 0 0 0-2.7 1.7l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .5.1 1.1.2 1.6l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.7 1.6l.4 2.9h2.8l.4-2.9a7 7 0 0 0 2.7-1.6l2.3 1 2-3.4-2-1.5c.1-.5.2-1 .2-1.6z"/></symbol>
    <symbol id="icon-audit" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/><path d="M9.5 12h5M9.5 16h5"/></symbol>
    <symbol id="icon-categories" viewBox="0 0 24 24"><path d="M11.6 3H4v7.6a2 2 0 0 0 .6 1.4l7.4 7.4a2 2 0 0 0 2.8 0l5-5a2 2 0 0 0 0-2.8L12.4 3.6a2 2 0 0 0-.8-.6z"/><circle cx="7.5" cy="6.5" r="1.2"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="icon-chev-l" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="icon-chev-r" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>

  {% block body %}{% endblock %}
</body>
</html>
