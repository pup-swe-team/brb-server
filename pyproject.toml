[project]
name = "brb-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.1,<5.2",
    "django-allauth[headless]>=65.19.7",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.5.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]


[tool.ruff]
target-version = "py312"
extend-exclude = [
    "**/migrations/*",
]

[tool.ruff.lint]
ignore = [
    "EXE001",  # Windows git checkouts do not maintain POSIX executable bits
]

[tool.ruff.lint.per-file-ignores]
# RUF012 wants every class attribute to be immutable, but two framework
# idioms are container attributes by contract, not by accident:
#   - Django reads `Meta.constraints` / `Meta.indexes` as plain lists.
#   - DRF merges `default_error_messages` across the serializer hierarchy.
"**/models.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
